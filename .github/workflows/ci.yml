name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Go test
        run: go test ./...

      - name: Build plugin and client
        run: |
          go build -o /tmp/zoraxy-relay .
          go build -o /tmp/zoraxy-relay-client ./client

      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --check web/connectors.js
          node --check web/enrollment.js
          node --check web/health.js
          node --check web/v111.js
          node --check web/setup.js
          node --check web/v113.js

      - name: Validate runtime metadata and active identifiers
        run: node scripts/validate-release.cjs /tmp/zoraxy-relay /tmp/zoraxy-relay-client

      - name: Build and validate all release assets
        run: bash scripts/build-release.sh /tmp/relay-assets

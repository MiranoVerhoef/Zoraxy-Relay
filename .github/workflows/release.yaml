name: Release

on:
  release:
    types: [published]

concurrency:
  group: relay-stable-release
  cancel-in-progress: false

jobs:
  build-binaries:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Validate release tag and source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "::error::The stable release tag must match the plugin version ($TAG)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Stable releases must use a commit merged into main."
            exit 1
          fi
          if [ -f .release-channel ]; then
            echo "::error::A stable release cannot contain beta channel metadata."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate store metadata
        run: |
          jq -e --slurpfile intro .introspect '
            (.[] | select(.PluginIntroSpect.id == $intro[0].id) | .PluginIntroSpect) as $store |
            $store.id == $intro[0].id and
            $store.name == $intro[0].name and
            $store.author == $intro[0].author and
            $store.version_major == $intro[0].version_major and
            $store.version_minor == $intro[0].version_minor and
            $store.version_patch == $intro[0].version_patch
          ' directories/index2.json

      - name: Build plugin + client
        run: |
          go test ./...
          bash scripts/build-release.sh dist

      - name: Upload binaries to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/zoraxy-relay_* dist/zoraxy-relay-client_* --clobber

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read plugin version
        id: version
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miranoverhoef/zoraxy-relay-client:latest
            ghcr.io/miranoverhoef/zoraxy-relay-client:${{ steps.version.outputs.tag }}

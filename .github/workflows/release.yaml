name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.introspect'
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Read plugin version
        id: version
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate store metadata
        run: |
          jq -e --slurpfile intro .introspect '
            (.[] | select(.PluginIntroSpect.id == $intro[0].id) | .PluginIntroSpect) as $store |
            $store.id == $intro[0].id and
            $store.name == $intro[0].name and
            $store.author == $intro[0].author and
            $store.version_major == $intro[0].version_major and
            $store.version_minor == $intro[0].version_minor and
            $store.version_patch == $intro[0].version_patch
          ' directories/index2.json

      - name: Build plugin + client
        run: |
          go test ./...
          bash scripts/build-release.sh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/zoraxy-relay_*
            dist/zoraxy-relay-client_*

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miranoverhoef/zoraxy-relay-client:latest
            ghcr.io/miranoverhoef/zoraxy-relay-client:${{ steps.version.outputs.tag }}
